<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double Pendulum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 14px; left: 14px;
      color: #aaa;
      font: 13px/1.6 monospace;
      pointer-events: none;
      user-select: none;
    }

    #resetBtn {
      position: fixed;
      top: 16px; right: 16px;
      width: 150px; height: 32px;
      background: #a03232;
      color: #fff;
      border: 1px solid #e06464;
      border-radius: 5px;
      font: 13px monospace;
      cursor: pointer;
      transition: background 0.15s;
    }
    #resetBtn:hover { background: #dc5050; }

    #camResetBtn {
      position: fixed;
      top: 56px; right: 16px;
      width: 150px; height: 32px;
      background: #2a4a7a;
      color: #fff;
      border: 1px solid #4488cc;
      border-radius: 5px;
      font: 13px monospace;
      cursor: pointer;
      transition: background 0.15s;
    }
    #camResetBtn:hover { background: #3366bb; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hudTitle"></div>
    <div>Left-drag: orbit &nbsp;|&nbsp; Right-drag: pan &nbsp;|&nbsp; Scroll: zoom</div>
  </div>
  <button id="resetBtn">Reset Simulation</button>
  <button id="camResetBtn">Reset Camera</button>

<script>
// ============================================================
//  CONFIG  — edit these to change the simulation
// ============================================================
const CFG = {
  // Pendulums
  NUM_PENDULUMS   : 100,
  CHAOS_OFFSET    : 0.0005,

  // Physics
  L1              : 1.5,
  L2              : 1.5,
  M1              : 2.0,
  M2              : 1.0,
  GRAVITY         : 9.81,

  // Initial conditions (radians)
  THETA1_INIT     : Math.PI / 2,
  THETA2_INIT     : Math.PI / 2,
  OMEGA1_INIT     : 0,
  OMEGA2_INIT     : 0,

  // Display
  PIVOT_Y         : 0.35,   // pivot y as fraction of screen height
  SCALE           : 0.20,   // rod length scale (fraction of screen height)

  // Trail
  TRAIL_LENGTH    : 500,
  TRAIL_ALPHA_MAX : 220,
  TRAIL_ALPHA_MIN : 0,
  TRAIL_WEIGHT    : 1.5,

  // Integration
  TIME_STEP       : 0.01,
  STEPS_PER_FRAME : 2,

  // Visual
  BG_COLOR        : 15,
  BOB_RADIUS      : 8,
  ROD_WEIGHT      : 2,
  SHOW_RODS       : true,
  SHOW_BOBS       : true,

  // 3D camera
  Z_SPREAD             : 80,
  CAM_INIT_ANGLE_X     : -0.25,
  CAM_INIT_ANGLE_Y     : 0.4,
  CAM_DRAG_SENSITIVITY : 0.005,
  CAM_PAN_SENSITIVITY  : 1.0,
  CAM_ZOOM_STEP        : 0.05,
  CAM_ZOOM_MIN         : 0.05,
  CAM_ZOOM_MAX         : 10.0,

  // Color palette
  COLOR_START     : [255, 51,  51],   // red
  COLOR_END       : [51,  136, 255],  // blue
};
// ============================================================

// ---- DoublePendulum class ----
class DoublePendulum {
  constructor(p, theta1, omega1, theta2, omega2, pivotX, pivotY, pivotZ, scale, col) {
    this.p      = p;       // p5 instance
    this.theta1 = theta1;  this.omega1 = omega1;
    this.theta2 = theta2;  this.omega2 = omega2;
    this.pivotX = pivotX;  this.pivotY = pivotY;  this.pivotZ = pivotZ;
    this.scale  = scale;
    this.col    = col;     // [r, g, b]
    this.m1 = CFG.M1;      this.m2 = CFG.M2;
    this.l1 = CFG.L1;      this.l2 = CFG.L2;
    this.g  = CFG.GRAVITY;
    this.trail = [];
  }

  alpha1(t1, w1, t2, w2) {
    const d   = t1 - t2;
    const num = -this.g * (2*this.m1 + this.m2) * Math.sin(t1)
                - this.m2 * this.g * Math.sin(t1 - 2*t2)
                - 2 * Math.sin(d) * this.m2 * (w2*w2*this.l2 + w1*w1*this.l1*Math.cos(d));
    const den = this.l1 * (2*this.m1 + this.m2 - this.m2 * Math.cos(2*t1 - 2*t2));
    return num / den;
  }

  alpha2(t1, w1, t2, w2) {
    const d   = t1 - t2;
    const num = 2 * Math.sin(d) * (
                  w1*w1*this.l1*(this.m1 + this.m2)
                  + this.g*(this.m1 + this.m2)*Math.cos(t1)
                  + w2*w2*this.l2*this.m2*Math.cos(d));
    const den = this.l2 * (2*this.m1 + this.m2 - this.m2 * Math.cos(2*t1 - 2*t2));
    return num / den;
  }

  update(dt) {
    const { theta1: t1, omega1: w1, theta2: t2, omega2: w2 } = this;

    const k1t1 = w1,  k1w1 = this.alpha1(t1,w1,t2,w2);
    const k1t2 = w2,  k1w2 = this.alpha2(t1,w1,t2,w2);

    const k2t1 = w1+.5*dt*k1w1, k2w1 = this.alpha1(t1+.5*dt*k1t1, w1+.5*dt*k1w1, t2+.5*dt*k1t2, w2+.5*dt*k1w2);
    const k2t2 = w2+.5*dt*k1w2, k2w2 = this.alpha2(t1+.5*dt*k1t1, w1+.5*dt*k1w1, t2+.5*dt*k1t2, w2+.5*dt*k1w2);

    const k3t1 = w1+.5*dt*k2w1, k3w1 = this.alpha1(t1+.5*dt*k2t1, w1+.5*dt*k2w1, t2+.5*dt*k2t2, w2+.5*dt*k2w2);
    const k3t2 = w2+.5*dt*k2w2, k3w2 = this.alpha2(t1+.5*dt*k2t1, w1+.5*dt*k2w1, t2+.5*dt*k2t2, w2+.5*dt*k2w2);

    const k4t1 = w1+dt*k3w1, k4w1 = this.alpha1(t1+dt*k3t1, w1+dt*k3w1, t2+dt*k3t2, w2+dt*k3w2);
    const k4t2 = w2+dt*k3w2, k4w2 = this.alpha2(t1+dt*k3t1, w1+dt*k3w1, t2+dt*k3t2, w2+dt*k3w2);

    this.theta1 += (dt/6)*(k1t1 + 2*k2t1 + 2*k3t1 + k4t1);
    this.omega1 += (dt/6)*(k1w1 + 2*k2w1 + 2*k3w1 + k4w1);
    this.theta2 += (dt/6)*(k1t2 + 2*k2t2 + 2*k3t2 + k4t2);
    this.omega2 += (dt/6)*(k1w2 + 2*k2w2 + 2*k3w2 + k4w2);

    if (CFG.TRAIL_LENGTH > 0) {
      const b2 = this.bob2Pos();
      this.trail.push(b2);
      if (this.trail.length > CFG.TRAIL_LENGTH) this.trail.shift();
    }
  }

  bob1Pos() {
    return {
      x: this.pivotX + this.l1 * this.scale * Math.sin(this.theta1),
      y: this.pivotY + this.l1 * this.scale * Math.cos(this.theta1),
      z: this.pivotZ
    };
  }

  bob2Pos() {
    const b1 = this.bob1Pos();
    return {
      x: b1.x + this.l2 * this.scale * Math.sin(this.theta2),
      y: b1.y + this.l2 * this.scale * Math.cos(this.theta2),
      z: this.pivotZ
    };
  }

  drawTrail() {
    const p = this.p;
    const n = this.trail.length;
    if (n < 2) return;
    const [r, g, b] = this.col;
    p.strokeWeight(CFG.TRAIL_WEIGHT);
    p.noFill();
    for (let i = 1; i < n; i++) {
      const t     = i / n;
      const alpha = p.lerp(CFG.TRAIL_ALPHA_MIN, CFG.TRAIL_ALPHA_MAX, t);
      p.stroke(r, g, b, alpha);
      const a = this.trail[i-1], bv = this.trail[i];
      p.line(a.x, a.y, a.z, bv.x, bv.y, bv.z);
    }
  }

  drawPendulum() {
    const p  = this.p;
    const b1 = this.bob1Pos();
    const b2 = this.bob2Pos();
    const [r, g, b] = this.col;

    if (CFG.SHOW_RODS) {
      p.stroke(r, g, b, 200);
      p.strokeWeight(CFG.ROD_WEIGHT);
      p.line(this.pivotX, this.pivotY, this.pivotZ, b1.x, b1.y, b1.z);
      p.line(b1.x, b1.y, b1.z, b2.x, b2.y, b2.z);
    }

    if (CFG.SHOW_BOBS) {
      p.noStroke();
      p.fill(r, g, b, 230);
      p.push(); p.translate(b1.x, b1.y, b1.z); p.sphere(CFG.BOB_RADIUS); p.pop();
      p.fill(255, 230);
      p.push(); p.translate(b2.x, b2.y, b2.z); p.sphere(CFG.BOB_RADIUS); p.pop();
    }
  }

  reset(t1, t2) {
    this.theta1 = t1; this.omega1 = 0;
    this.theta2 = t2; this.omega2 = 0;
    this.trail  = [];
  }
}

// ---- p5.js sketch ----
new p5(function(p) {
  let pendulums = [];
  let pivotX, pivotY, scalePixels;
  let camAngleX, camAngleY, camOffsetX, camOffsetY, camZoom;
  let prevMouseX, prevMouseY;

  function lerpCol(a, b, t) {
    return [
      p.lerp(a[0], b[0], t),
      p.lerp(a[1], b[1], t),
      p.lerp(a[2], b[2], t)
    ];
  }

  function buildPendulums() {
    pendulums = [];
    const totalZ = (CFG.NUM_PENDULUMS - 1) * CFG.Z_SPREAD;
    for (let i = 0; i < CFG.NUM_PENDULUMS; i++) {
      const t  = CFG.NUM_PENDULUMS === 1 ? 0.5 : i / (CFG.NUM_PENDULUMS - 1);
      const col = lerpCol(CFG.COLOR_START, CFG.COLOR_END, t);
      const pz  = i * CFG.Z_SPREAD - totalZ / 2;
      pendulums.push(new DoublePendulum(
        p,
        CFG.THETA1_INIT + i * CFG.CHAOS_OFFSET, CFG.OMEGA1_INIT,
        CFG.THETA2_INIT, CFG.OMEGA2_INIT,
        pivotX, pivotY, pz,
        scalePixels, col
      ));
    }
    document.getElementById('hudTitle').textContent =
      `Double Pendulum  |  ${CFG.NUM_PENDULUMS} pendulums  |  chaos offset: ${CFG.CHAOS_OFFSET}`;
  }

  function resetCamera() {
    camAngleX = CFG.CAM_INIT_ANGLE_X;
    camAngleY = CFG.CAM_INIT_ANGLE_Y;
    camOffsetX = 0; camOffsetY = 0;
    camZoom = 1.0;
  }

  p.setup = function() {
    p.createCanvas(window.innerWidth, window.innerHeight, p.WEBGL);
    p.frameRate(60);

    // In WEBGL mode origin is at center, so pivot coords are relative to center
    pivotX      = 0;
    pivotY      = p.height * CFG.PIVOT_Y - p.height / 2;
    scalePixels = p.height * CFG.SCALE;

    resetCamera();
    buildPendulums();

    document.getElementById('resetBtn').addEventListener('click', () => buildPendulums());
    document.getElementById('camResetBtn').addEventListener('click', () => resetCamera());
  };

  p.draw = function() {
    p.background(CFG.BG_COLOR);
    p.lights();

    // Camera transform
    p.translate(camOffsetX, camOffsetY, 0);
    p.translate(pivotX, pivotY, 0);
    p.scale(camZoom);
    p.rotateX(camAngleX);
    p.rotateY(camAngleY);
    p.translate(-pivotX, -pivotY, 0);

    // Physics
    for (const pd of pendulums) {
      for (let s = 0; s < CFG.STEPS_PER_FRAME; s++) pd.update(CFG.TIME_STEP);
    }

    // Trails
    for (const pd of pendulums) pd.drawTrail();

    // Pivot marker
    p.noStroke();
    p.fill(200);
    p.push(); p.translate(pivotX, pivotY, 0); p.sphere(5); p.pop();

    // Rods and bobs
    for (const pd of pendulums) pd.drawPendulum();
  };

  p.windowResized = function() {
    p.resizeCanvas(window.innerWidth, window.innerHeight);
    pivotX      = 0;
    pivotY      = p.height * CFG.PIVOT_Y - p.height / 2;
    scalePixels = p.height * CFG.SCALE;
    pendulums.forEach(pd => {
      pd.pivotX = pivotX;
      pd.pivotY = pivotY;
      pd.scale  = scalePixels;
    });
  };

  // ---- Mouse input ----
  p.mousePressed = function() {
    prevMouseX = p.mouseX;
    prevMouseY = p.mouseY;
  };

  p.mouseDragged = function() {
    const dx = p.mouseX - prevMouseX;
    const dy = p.mouseY - prevMouseY;
    if (p.mouseButton === p.RIGHT) {
      camOffsetX += dx * CFG.CAM_PAN_SENSITIVITY;
      camOffsetY += dy * CFG.CAM_PAN_SENSITIVITY;
    } else {
      camAngleY += dx * CFG.CAM_DRAG_SENSITIVITY;
      camAngleX += dy * CFG.CAM_DRAG_SENSITIVITY;
    }
    prevMouseX = p.mouseX;
    prevMouseY = p.mouseY;
    return false;
  };

  p.mouseWheel = function(e) {
    camZoom -= e.delta * 0.001;
    camZoom  = p.constrain(camZoom, CFG.CAM_ZOOM_MIN, CFG.CAM_ZOOM_MAX);
    return false;
  };

  p.keyPressed = function() {
    if (p.key === 'r' || p.key === 'R') buildPendulums();
    if (p.key === ' ')                  resetCamera();
  };
});
</script>
</body>
</html>
